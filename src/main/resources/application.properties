spring.application.name=seva-mobile-version

server.port=${PORT:8080}

spring.datasource.url=${DB_CONNECTION}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
# Logs the SQL statements to the console (useful for development)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# (Optional) Explicitly defines the PostgreSQL Dialect if auto-detection fails
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT configuration
# jwt.secret must be at least 256 bits (32 chars) for HS256; override via env var in production
jwt.secret=${JWT_SECRET}
# Access token: 15 minutes
jwt.access-token-expiration-ms=900000
# Refresh token: 7 days
jwt.refresh-token-expiration-ms=604800000


#Email Configurations
spring.mail.host=smtp.gmail.com
spring.mail.port=${SMTP_PORT}
spring.mail.username=${HOST_EMAIL}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Email verification code: 15 minutes
verification.code-expiration-ms=900000